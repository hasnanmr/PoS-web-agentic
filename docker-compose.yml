# Local development services only. Hosted environments use Supabase Postgres and a managed
# RabbitMQ on Railway. Passwords come from backend/.env (template: backend/.env.example).
# Start with `make up` (or `docker compose --env-file backend/.env up -d`).
#
# Apply schema migrations (Alembic, backend/migrations/) with, e.g.:
#   make db-reset     (shim + migrations + seed + app_backend password)
#   make db-migrate   (pending migrations only)
name: sme-pos

services:
  postgres:
    # 16.16 is the 12 November 2026 security release (52 CVEs, including CVE-2026-6460, where an
    # object creator can execute code as the OS user running the database). An existing 16.x
    # volume upgrades in place; no dump/restore. Keep the `postgres-data` volume: never run
    # `docker compose down -v` here, it deletes the local database (schema, seed, test data).
    image: postgres:16.16
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD}
      POSTGRES_DB: pos
      TZ: Asia/Jakarta
      PGTZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d pos"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    # Pinned, and on 4.x because that is the only line with an OSS fix: the October 2026
    # advisories (memory DoS via incomplete AMQP 0-9-1 messages, SASL credentials in crash
    # dumps) are fixed in 4.3.7/4.2.12/4.1.17, and 3.13.21 is enterprise-only. 4.3.8 is the
    # patch release on the line where the fixes landed. Nothing talks to the broker yet (the
    # worker is a stub), so the major bump only affects local development.
    # The `rabbitmq-data` volume is kept as is. Do not delete volumes (no `down -v`): they must
    # persist across image bumps, DB fixes and migrations. Plain `docker compose up -d` or
    # `down` (without -v) is safe.
    image: rabbitmq:4.3.8-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: ${LOCAL_RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI: http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  rabbitmq-data:
