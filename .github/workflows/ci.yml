# CI (T-009): migrations, SQL tests (schema, RLS, token hook), backend tests and lint,
# API contract check, and the admin app build. Runs on every push and pull request.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Database + backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sme_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sme_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sme_test
      TEST_APP_DATABASE_URL: postgresql://app_backend:app_backend_ci@localhost:5432/sme_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check-migrations compares against origin/main

      - name: Migration hygiene
        run: scripts/check-migrations.sh
        env:
          MIGRATION_BASE_REF: origin/main

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Migrations, seed, schema and RLS tests
        run: |
          scripts/db-test.sh | tee db-test.log
          if grep -q "FAIL" db-test.log; then exit 1; fi

      - name: Seed is idempotent
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f supabase/seed.sql

      - name: Password for the backend role (CI only)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "alter role app_backend password 'app_backend_ci'"

      - uses: astral-sh/setup-uv@v6
        with:
          working-directory: backend

      - name: Backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Lint
        working-directory: backend
        run: uv run ruff check . && uv run ruff format --check .

      - name: Tests (unit + integration against Postgres)
        working-directory: backend
        run: uv run pytest

      - name: API contract (docs/api/openapi.json is up to date)
        working-directory: backend
        run: uv run python -m app.tools.export_openapi --check

  admin:
    name: Admin app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: admin/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build
        run: pnpm build
        env:
          VITE_API_BASE_URL: http://localhost:8000
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
