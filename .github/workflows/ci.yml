# CI (T-009): migrations, SQL tests (schema, RLS, token hook), backend tests and lint,
# API contract check, and the admin app build. Runs on every push and pull request.
#
# CD: on a push to main, once CI is green, pending Supabase migrations are applied to the
# hosted database first, then the changed service is deployed to Railway (backend/ ->
# "backend" service, admin/ -> "admin" service). Needs the repository secrets RAILWAY_TOKEN
# (project token of the Railway environment) and SUPABASE_DB_URL (session pooler connection
# string of the hosted project, with the database password); see README "Deployment".
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Database + backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway container that only lives for this job: trust auth, so no
          # password literal is needed anywhere in the workflow.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: sme_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/sme_test
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/sme_test
      TEST_APP_DATABASE_URL: postgresql://app_backend@localhost:5432/sme_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check-migrations compares against origin/main

      - name: Migration hygiene
        run: scripts/check-migrations.sh
        env:
          MIGRATION_BASE_REF: origin/main

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Migrations, seed, schema and RLS tests
        run: |
          scripts/db-test.sh | tee db-test.log
          if grep -q "FAIL" db-test.log; then exit 1; fi

      - name: Seed is idempotent
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f supabase/seed.sql

      - uses: astral-sh/setup-uv@v6
        with:
          working-directory: backend

      - name: Backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Lint
        working-directory: backend
        run: uv run ruff check . && uv run ruff format --check .

      - name: Tests (unit + integration against Postgres)
        working-directory: backend
        run: uv run pytest

      - name: API contract (docs/api/openapi.json is up to date)
        working-directory: backend
        run: uv run python -m app.tools.export_openapi --check

  admin:
    name: Admin app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: admin/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build
        run: pnpm build
        env:
          VITE_API_BASE_URL: http://localhost:8000
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  changes:
    name: Detect changed services
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'supabase/**'
            admin:
              - 'admin/**'

  migrate:
    name: Apply Supabase migrations
    needs: [backend, admin, changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: migrate-supabase
      cancel-in-progress: false
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Check the secret
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Repository secret SUPABASE_DB_URL is not set (see README 'Deployment')"; exit 1
          fi
      # Migrations are additive and run before the new backend is deployed, so the running
      # code never reads a table or column that does not exist yet. Already-applied
      # migrations are skipped (supabase_migrations.schema_migrations).
      - name: Pending migrations
        run: supabase db push --remote="$SUPABASE_DB_URL" --skip-vault --dry-run
      - name: Apply
        run: supabase db push --remote="$SUPABASE_DB_URL" --skip-vault

  deploy-backend:
    name: Deploy backend to Railway
    needs: [backend, admin, changes, migrate]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.75.0
      - name: Deploy
        run: railway up backend --path-as-root --service backend --ci --message "$GITHUB_SHA"

  deploy-admin:
    name: Deploy admin to Railway
    needs: [backend, admin, changes]
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-admin
      cancel-in-progress: false
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.75.0
      - name: Deploy
        run: railway up admin --path-as-root --service admin --ci --message "$GITHUB_SHA"
