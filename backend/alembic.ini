# Alembic: schema migrations for the hosted Supabase Postgres and local/CI Postgres.
# Each revision runs one plain-SQL file from migrations/sql/ (see migrations/README.md).
# The database URL comes from MIGRATION_DATABASE_URL (an owner role such as `postgres`,
# session mode / port 5432), never from this file. Run: uv run python -m app.tools.migrate
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = %(here)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
