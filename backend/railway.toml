# Railway config for the backend API service. The deploy workflow (.github/workflows/ci.yml)
# uploads backend/ as the service root, so this file and Dockerfile sit at the root of the
# build context (for Railway-side GitHub deploys set Root Directory = /backend instead).
#
# WhatsApp worker: a SEPARATE Railway service later, same image (backend/Dockerfile), start
# command `python -m app.worker.main`, no healthcheck/public domain.
#
# Required variables (see backend/.env.example): APP_ENV, DATABASE_URL, SUPABASE_URL,
# SUPABASE_JWKS_URL, SUPABASE_JWT_ISSUER, RABBITMQ_URL, CORS_ORIGINS, DEFAULT_TIMEZONE.
# Railway injects PORT.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -m app.serve"
healthcheckPath = "/readyz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
