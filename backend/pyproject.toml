[project]
name = "sme-pos-backend"
version = "0.1.0"
description = "SME POS + WhatsApp ordering platform: API service and WhatsApp worker"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16",
    "deepagents>=0.7.41",
    "fastapi>=0.163.2",
    "langchain-openai>=1.8.5",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.10",
    "segno>=1.6.6",
    "sqlalchemy>=2.0.40",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608"]  # S608: SQL built from constant test UUIDs
